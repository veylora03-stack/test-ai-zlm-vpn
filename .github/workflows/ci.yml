name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pip-audit
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
      - name: Run pip-audit
        run: |
          cd backend
          pip-audit --desc
      - name: Run Unit and Integration tests
  run: |
    pytest tests/unit tests/integration -v --cov=backend --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: jpetrucciani/bandit-check@1.7.0
        with:
          path: './backend'




    e2e-tests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Start FastAPI server
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "FastAPI server did not become ready"
          cat /tmp/uvicorn.log
          exit 1
      - name: Run E2E tests
        run: |
          pytest tests/e2e/test_e2e.py -v
