name: Windows CI / Build EXE

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller flake8 pytest pytest-asyncio pytest-cov httpx

    - name: Lint backend (flake8)
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Unit tests
      run: |
        pytest tests/unit/test_parser.py tests/unit/test_scanner.py --maxfail=1 --disable-warnings -v

    - name: Verify Python package structure
      run: |
        python -c "import backend; print('OK: backend package found at:', backend.__file__)"
        python -c "from backend.core.logger import logger; print('OK: logger import successful')"
        python -c "from backend.app.main import app; print('OK: application import successful')"

    - name: Start FastAPI and Run E2E tests
      shell: pwsh
      run: |
        $stdoutLog = "$env:GITHUB_WORKSPACE\uvicorn.stdout.log"
        $stderrLog = "$env:GITHUB_WORKSPACE\uvicorn.stderr.log"

        Write-Host "Starting Uvicorn from repository root with module: backend.app.main:app"
        Write-Host "stdout: $stdoutLog"
        Write-Host "stderr: $stderrLog"

        $process = Start-Process `
          -FilePath "python" `
          -ArgumentList "-m", "uvicorn", "backend.app.main:app", "--host", "127.0.0.1", "--port", "8000", "--log-level", "info" `
          -RedirectStandardOutput $stdoutLog `
          -RedirectStandardError $stderrLog `
          -PassThru `
          -WindowStyle Hidden

        try {
            Write-Host "Uvicorn process started with PID: $($process.Id)"
            Write-Host "Waiting for server to become ready..."

            $ready = $false
            for ($i = 1; $i -le 30; $i++) {
                Start-Sleep -Seconds 1

                if ($process.HasExited) {
                    Write-Host "Uvicorn process exited early with code: $($process.ExitCode)"
                    Write-Host "--- Uvicorn stdout ---"
                    if (Test-Path $stdoutLog) {
                        Get-Content $stdoutLog
                    } else {
                        Write-Host "stdout log not found: $stdoutLog"
                    }
                    Write-Host "--- Uvicorn stderr ---"
                    if (Test-Path $stderrLog) {
                        Get-Content $stderrLog
                    } else {
                        Write-Host "stderr log not found: $stderrLog"
                    }
                    exit 1
                }

                try {
                    $response = Invoke-WebRequest `
                      -Uri "http://127.0.0.1:8000/api/health" `
                      -UseBasicParsing `
                      -TimeoutSec 2

                    if ($response.StatusCode -eq 200) {
                        Write-Host "FastAPI server is ready and responding!"
                        $ready = $true
                        break
                    }
                } catch {
                    Write-Host "Waiting for FastAPI... attempt $i/30"
                }
            }

            if (-not $ready) {
                Write-Host "FastAPI server did not become ready within 30 seconds."
                Write-Host "--- Uvicorn stdout ---"
                if (Test-Path $stdoutLog) {
                    Get-Content $stdoutLog
                } else {
                    Write-Host "stdout log not found: $stdoutLog"
                }
                Write-Host "--- Uvicorn stderr ---"
                if (Test-Path $stderrLog) {
                    Get-Content $stderrLog
                } else {
                    Write-Host "stderr log not found: $stderrLog"
                }
                exit 1
            }

            Write-Host "Server is ready. Running E2E tests..."
            pytest tests/e2e/ -v --maxfail=1 --disable-warnings

            $pytestExitCode = $LASTEXITCODE

            if ($pytestExitCode -ne 0) {
                Write-Host "E2E tests failed with exit code: $pytestExitCode"
                Write-Host "--- Uvicorn stdout ---"
                if (Test-Path $stdoutLog) {
                    Get-Content $stdoutLog
                }
                Write-Host "--- Uvicorn stderr ---"
                if (Test-Path $stderrLog) {
                    Get-Content $stderrLog
                }
                exit $pytestExitCode
            }

            Write-Host "All E2E tests passed!"

        } finally {
            if ($process -and -not $process.HasExited) {
                Write-Host "Stopping Uvicorn..."
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
        }

    - name: Check Frontend Syntax
      shell: pwsh
      run: |
        $jsFiles = Get-ChildItem -Path "frontend/js" -Filter "*.js" -File -Recurse

        if ($jsFiles.Count -eq 0) {
          Write-Error "No JavaScript files found in frontend/js"
          exit 1
        }

        Write-Host "Found $($jsFiles.Count) JavaScript files."
        $allPassed = $true

        foreach ($file in $jsFiles) {
          Write-Host "Checking: $($file.FullName)"
          node --check "$($file.FullName)"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "JavaScript syntax check failed: $($file.FullName)"
            $allPassed = $false
          }
        }

        if (-not $allPassed) {
          exit 1
        }

        Write-Host "All JavaScript files passed syntax check."

    - name: Build EXE with PyInstaller (with backend package support)
      shell: pwsh
      run: |
        Write-Host "Building EXE from backend/launcher.py..."
        Write-Host "Using --paths . to include project root for backend package"
        Write-Host "Using --hidden-import to explicitly include backend modules"

        pyinstaller `
          --onefile `
          --name ERROR-Panel `
          --distpath backend/dist `
          --paths . `
          --hidden-import backend `
          --hidden-import backend.core `
          --hidden-import backend.app `
          --hidden-import backend.services `
          --hidden-import backend.api `
          --hidden-import backend.middleware ` --hidden-import aiosqlite `
          backend/launcher.py

        if ($LASTEXITCODE -ne 0) {
          Write-Error "PyInstaller build failed!"
          exit $LASTEXITCODE
        }

        Write-Host "PyInstaller build completed successfully."

        $exePath = "backend/dist/ERROR-Panel.exe"

        if (-not (Test-Path $exePath)) {
          Write-Error "EXE was not generated at: $exePath"
          Write-Host "Searching for ERROR-Panel.exe in repository..."
          Get-ChildItem -Path . -Filter "ERROR-Panel.exe" -File -Recurse
          exit 1
        }

        $exeInfo = Get-Item $exePath
        Write-Host "EXE generated successfully:"
        Write-Host "  Path: $($exeInfo.FullName)"
        Write-Host "  Size: $([math]::Round($exeInfo.Length / 1MB, 2)) MB"
        Write-Host "  LastWriteTime: $($exeInfo.LastWriteTime)"

    - name: Smoke Test EXE (Real Gate)
      shell: pwsh
      run: |
        $exePath = "backend/dist/ERROR-Panel.exe"

        if (-not (Test-Path $exePath)) {
          Write-Error "EXE not found: $exePath"
          exit 1
        }

        $stdoutLog = "$env:GITHUB_WORKSPACE\ERROR-Panel.stdout.log"
        $stderrLog = "$env:GITHUB_WORKSPACE\ERROR-Panel.stderr.log"

        Write-Host "Starting EXE: $exePath"
        Write-Host "stdout: $stdoutLog"
        Write-Host "stderr: $stderrLog"

        $process = Start-Process `
          -FilePath $exePath `
          -RedirectStandardOutput $stdoutLog `
          -RedirectStandardError $stderrLog `
          -PassThru `
          -WindowStyle Hidden

        Write-Host "EXE started with PID: $($process.Id)"
        Write-Host "Waiting for EXE to become ready (checking /api/health)..."

        $ready = $false

        for ($i = 1; $i -le 30; $i++) {
          Start-Sleep -Seconds 1

          if ($process.HasExited) {
            Write-Host "EXE exited early with code: $($process.ExitCode)"
            Write-Host "=== EXE STDOUT ==="
            if (Test-Path $stdoutLog) {
              Get-Content $stdoutLog
            } else {
              Write-Host "stdout log not found"
            }
            Write-Host "=== EXE STDERR ==="
            if (Test-Path $stderrLog) {
              Get-Content $stderrLog
            } else {
              Write-Host "stderr log not found"
            }
            exit 1
          }

          try {
            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8000/api/health" `
              -UseBasicParsing `
              -TimeoutSec 2

            if ($response.StatusCode -eq 200) {
              Write-Host "EXE is ready and responding on /api/health!"
              $ready = $true
              break
            }
          } catch {
            Write-Host "Waiting for EXE... attempt $i/30"
          }
        }

        if (-not $ready) {
          Write-Host "EXE did not become ready within 30 seconds."
          Write-Host "=== EXE STDOUT ==="
          if (Test-Path $stdoutLog) {
            Get-Content $stdoutLog
          }
          Write-Host "=== EXE STDERR ==="
          if (Test-Path $stderrLog) {
            Get-Content $stderrLog
          }
          exit 1
        }

        Write-Host "Smoke test PASSED: EXE is running and healthy."
        Write-Host "Stopping EXE..."
        Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ERROR-Panel-Windows
        path: backend/dist/ERROR-Panel.exe