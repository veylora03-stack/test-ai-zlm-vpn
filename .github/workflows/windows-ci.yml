name: Windows CI / Build EXE

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller flake8 pytest pytest-asyncio pytest-cov httpx

    - name: Lint backend (flake8)
      run: |
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Unit tests
      run: |
        pytest tests/unit/test_parser.py tests/unit/test_scanner.py --maxfail=1 --disable-warnings -v

    - name: Verify Python package structure
      run: |
        python -c "import backend; print('OK: backend package found at:', backend.__file__)"
        python -c "from backend.core.logger import logger; print('OK: logger import successful')"
        python -c "from backend.app.main import app; print('OK: application import successful')"

    - name: Start FastAPI server for E2E tests
      run: |
        $stdoutLog = "$env:GITHUB_WORKSPACE\uvicorn.stdout.log"
        $stderrLog = "$env:GITHUB_WORKSPACE\uvicorn.stderr.log"

        Write-Host "Starting Uvicorn from repository root with module: backend.app.main:app"
        Write-Host "stdout: $stdoutLog"
        Write-Host "stderr: $stderrLog"

        $process = Start-Process `
          -FilePath "python" `
          -ArgumentList "-m", "uvicorn", "backend.app.main:app", "--host", "127.0.0.1", "--port", "8000", "--log-level", "info" `
          -RedirectStandardOutput $stdoutLog `
          -RedirectStandardError $stderrLog `
          -PassThru `
          -WindowStyle Hidden

        Write-Host "Uvicorn process started with PID: $($process.Id)"
        Write-Host "Waiting for server to become ready..."

        $ready = $false
        for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 1

            if ($process.HasExited) {
                Write-Host "Uvicorn process exited early with code: $($process.ExitCode)"
                Write-Host "--- Uvicorn stdout ---"
                if (Test-Path $stdoutLog) {
                    Get-Content $stdoutLog
                } else {
                    Write-Host "stdout log not found: $stdoutLog"
                }
                Write-Host "--- Uvicorn stderr ---"
                if (Test-Path $stderrLog) {
                    Get-Content $stderrLog
                } else {
                    Write-Host "stderr log not found: $stderrLog"
                }
                exit 1
            }

            try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:8000/api/health" `
                  -UseBasicParsing `
                  -TimeoutSec 2

                if ($response.StatusCode -eq 200) {
                    Write-Host "FastAPI server is ready and responding!"
                    $ready = $true
                    break
                }
            } catch {
                Write-Host "Waiting for FastAPI... attempt $i/30"
            }
        }

        if (-not $ready) {
            Write-Host "FastAPI server did not become ready within 30 seconds."
            Write-Host "--- Uvicorn stdout ---"
            if (Test-Path $stdoutLog) {
                Get-Content $stdoutLog
            } else {
                Write-Host "stdout log not found: $stdoutLog"
            }
            Write-Host "--- Uvicorn stderr ---"
            if (Test-Path $stderrLog) {
                Get-Content $stderrLog
            } else {
                Write-Host "stderr log not found: $stderrLog"
            }
            exit 1
        }

        Write-Host "Server is ready. Performing post-readiness checks..."
        Start-Sleep -Seconds 2

        if ($process.HasExited) {
            Write-Host "Uvicorn process died after readiness check!"
            Write-Host "Exit code: $($process.ExitCode)"
            Write-Host "--- Uvicorn stdout ---"
            if (Test-Path $stdoutLog) {
                Get-Content $stdoutLog
            }
            Write-Host "--- Uvicorn stderr ---"
            if (Test-Path $stderrLog) {
                Get-Content $stderrLog
            }
            exit 1
        }

        Write-Host "Uvicorn process is still alive (PID: $($process.Id))"

        Write-Host "=== Port 8000 status ==="
        netstat -ano | findstr :8000

        Write-Host "=== Direct HTTPX connectivity test ==="
        python -c "import httpx; r=httpx.get('http://127.0.0.1:8000/api/health', trust_env=False, timeout=5); print(f'HTTPX status: {r.status_code}'); print(r.text)"

        if ($LASTEXITCODE -ne 0) {
            Write-Host "Direct HTTPX test failed!"
            exit 1
        }

        Write-Host "All diagnostics passed. Proceeding to E2E tests."

    - name: Run E2E tests
      run: |
        pytest tests/e2e/ -v --maxfail=1 --disable-warnings

    - name: Dump Uvicorn diagnostics (if E2E fails)
      if: always()
      shell: pwsh
      run: |
        $stdoutLog = "$env:GITHUB_WORKSPACE\uvicorn.stdout.log"
        $stderrLog = "$env:GITHUB_WORKSPACE\uvicorn.stderr.log"

        Write-Host "=== Uvicorn STDOUT (if exists) ==="
        if (Test-Path $stdoutLog) {
            Get-Content $stdoutLog
        } else {
            Write-Host "No stdout log found."
        }

        Write-Host "=== Uvicorn STDERR (if exists) ==="
        if (Test-Path $stderrLog) {
            Get-Content $stderrLog
        } else {
            Write-Host "No stderr log found."
        }

        Write-Host "=== Port 8000 status ==="
        netstat -ano | findstr :8000

        Write-Host "=== Process list for python ==="
        Get-Process -Name python -ErrorAction SilentlyContinue

    - name: Check Frontend Syntax
      run: |
        node --check frontend/js/*.js

    - name: Build EXE with PyInstaller
      run: |
        cd backend
        pyinstaller --onefile --name ERROR-Panel main.py
        dir dist

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ERROR-Panel-Windows
        path: backend/dist/ERROR-Panel.exe